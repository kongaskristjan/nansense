del(inputs), targets)</text><text x="25.6" y="264.68" class="gutter" text-anchor="end">11</text><text x="31.6" y="264.68" class="sign-del">-</text><text x="45.4" y="264.68" class="code" xml:space="preserve" textLength="179.4" lengthAdjust="spacingAndGlyphs">        loss.backward()</text><text x="25.6" y="283.68" class="gutter" text-anchor="end">12</text><text x="31.6" y="283.68" class="sign-del">-</text><text x="45.4" y="283.68" class="code" xml:space="preserve" textLength="187.2" lengthAdjust="spacingAndGlyphs">        optimizer.step()</text><text x="25.6" y="302.68" class="gutter" text-anchor="end">13</text><text x="863.0" y="302.68" class="gutter" text-anchor="end">10</text><text x="863.0" y="321.68" class="gutter" text-anchor="end">11</text><text x="882.8" y="321.68" class="code" xml:space="preserve" textLength="780.0" lengthAdjust="spacingAndGlyphs"># restorer while/with time-travel loop: wrap the epoch loop so the UI jump can rewind and replay it.</text><text x="863.0" y="340.68" class="gutter" text-anchor="end">12</text><text x="869.0" y="340.68" class="sign-add">+</text><text x="882.8" y="340.68" class="code" xml:space="preserve" textLength="491.4" lengthAdjust="spacingAndGlyphs">restorer = session.training_restorer(cache_dir=&quot;models/latest&quot;)</text><text x="863.0" y="359.68" class="gutter" text-anchor="end">13</text><text x="869.0" y="359.68" class="sign-add">+</text><text x="882.8" y="359.68" class="code" xml:space="preserve" textLength="195.0" lengthAdjust="spacingAndGlyphs">while restorer.pending():</text><text x="863.0" y="378.68" class="gutter" text-anchor="end">14</text><text x="869.0" y="378.68" class="sign-add">+</text><text x="882.8" y="378.68" class="code" xml:space="preserve" textLength="140.4" lengthAdjust="spacingAndGlyphs">    with restorer:</text><text x="863.0" y="397.68" class="gutter" text-anchor="end">15</text><text x="869.0" y="397.68" class="sign-add">+</text><text x="882.8" y="397.68" class="code" xml:space="preserve" textLength="304.2" lengthAdjust="spacingAndGlyphs">        for epoch in restorer.epochs():</text><text x="863.0" y="416.68" class="gutter" text-anchor="end">16</text><text x="869.0" y="416.68" class="sign-add">+</text><text x="882.8" y="416.68" class="code" xml:space="preserve" textLength="725.4" lengthAdjust="spacingAndGlyphs">            for inputs, targets in session.batches(train_loader, phase=&quot;train&quot;, epoch=epoch):</text><text x="863.0" y="435.68" class="gutter" text-anchor="end">17</text><text x="869.0" y="435.68" class="sign-add">+</text><text x="882.8" y="435.68" class="code" xml:space="preserve" textLength="288.6" lengthAdjust="spacingAndGlyphs">                optimizer.zero_grad()</text><text x="863.0" y="454.68" class="gutter" text-anchor="end">18</text><text x="869.0" y="454.68" class="sign-add">+</text><text x="882.8" y="454.68" class="code" xml:space="preserve" textLength="436.8" lengthAdjust="spacingAndGlyphs">                loss = criterion(model(inputs), targets)</text><text x="863.0" y="473.68" class="gutter" text-anchor="end">19</text><text x="869.0" y="473.68" class="sign-add">+</text><text x="882.8" y="473.68" class="code" xml:space="preserve" textLength="241.8" lengthAdjust="spacingAndGlyphs">                loss.backward()</text><text x="863.0" y="492.68" class="gutter" text-anchor="end">20</text><text x="869.0" y="492.68" class="sign-add">+</text><text x="882.8" y="492.68" class="code" xml:space="preserve" textLength="249.6" lengthAdjust="spacingAndGlyphs">                optimizer.step()</text><text x="863.0" y="511.68" class="gutter" text-anchor="end">21</text><text x="25.6" y="530.68" class="gutter" text-anchor="end">14</text><text x="45.4" y="530.68" class="code" xml:space="preserve" textLength="195.0" lengthAdjust="spacingAndGlyphs">    # Validation loop ...</text><text x="863.0" y="530.68" class="gutter" text-anchor="end">22</text><text x="882.8" y="530.68" class="code" xml:space="preserve" textLength="397.8" lengthAdjust="spacingAndGlyphs">            # Validation loop ... (use phase=&quot;val&quot;)</text><text x="863.0" y="549.68" class="gutter" text-anchor="end">23</text><text x="863.0" y="568.68" class="gutter" text-anchor="end">24</text><text x="869.0" y="568.68" class="sign-add">+</text><text x="882.8" y="568.68" class="code" xml:space="preserve" textLength="117.0" lengthAdjust="spacingAndGlyphs">session.close()</text><text x="45.4" y="22.44" class="hdr">Raw PyTorch</text><text x="882.8" y="22.44" class="hdr">Raw PyTorch + nansense</text>

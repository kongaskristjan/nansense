  <text x="25.6" y="55.68" class="gutter" text-anchor="end">1</text><text x="45.4" y="55.68" class="code" xml:space="preserve" textLength="93.6" lengthAdjust="spacingAndGlyphs">import torch</text><text x="948.8" y="55.68" class="gutter" text-anchor="end">1</text><text x="968.6" y="55.68" class="code" xml:space="preserve" textLength="93.6" lengthAdjust="spacingAndGlyphs">import torch</text><text x="948.8" y="74.68" class="gutter" text-anchor="end">2</text><text x="954.8" y="74.68" class="sign-add">+</text><text x="968.6" y="74.68" class="code" xml:space="preserve" textLength="117.0" lengthAdjust="spacingAndGlyphs">import nansense</text><text x="25.6" y="93.68" class="gutter" text-anchor="end">2</text><text x="948.8" y="93.68" class="gutter" text-anchor="end">3</text><text x="25.6" y="112.68" class="gutter" text-anchor="end">3</text><text x="45.4" y="112.68" class="code" xml:space="preserve" textLength="202.8" lengthAdjust="spacingAndGlyphs">model = MyNet().to(device)</text><text x="948.8" y="112.68" class="gutter" text-anchor="end">4</text><text x="968.6" y="112.68" class="code" xml:space="preserve" textLength="202.8" lengthAdjust="spacingAndGlyphs">model = MyNet().to(device)</text><text x="25.6" y="131.68" class="gutter" text-anchor="end">4</text><text x="45.4" y="131.68" class="code" xml:space="preserve" textLength="452.4" lengthAdjust="spacingAndGlyphs">optimizer = torch.optim.AdamW(model.parameters(), lr=1e-3)</text><text x="948.8" y="131.68" class="gutter" text-anchor="end">5</text><text x="968.6" y="131.68" class="code" xml:space="preserve" textLength="452.4" lengthAdjust="spacingAndGlyphs">optimizer = torch.optim.AdamW(model.parameters(), lr=1e-3)</text><text x="25.6" y="150.68" class="gutter" text-anchor="end">5</text><text x="948.8" y="150.68" class="gutter" text-anchor="end">6</text><text x="948.8" y="169.68" class="gutter" text-anchor="end">7</text><text x="954.8" y="169.68" class="sign-add">+</text><text x="968.6" y="169.68" class="code" xml:space="preserve" textLength="865.8" lengthAdjust="spacingAndGlyphs">session = nansense.start(model, epochs=50, phases={&quot;train&quot;: len(train_loader)}, optimizer=optimizer, port=8080)</text><text x="948.8" y="188.68" class="gutter" text-anchor="end">8</text><text x="948.8" y="207.68" class="gutter" text-anchor="end">9</text><text x="968.6" y="207.68" class="code" xml:space="preserve" textLength="569.4" lengthAdjust="spacingAndGlyphs"># Time travel: wrap the epoch loop so a UI jump can rewind and replay it.</text><text x="948.8" y="226.68" class="gutter" text-anchor="end">10</text><text x="954.8" y="226.68" class="sign-add">+</text><text x="968.6" y="226.68" class="code" xml:space="preserve" textLength="491.4" lengthAdjust="spacingAndGlyphs">restorer = session.training_restorer(cache_dir=&quot;models/latest&quot;)</text><text x="948.8" y="245.68" class="gutter" text-anchor="end">11</text><text x="954.8" y="245.68" class="sign-add">+</text><text x="968.6" y="245.68" class="code" xml:space="preserve" textLength="195.0" lengthAdjust="spacingAndGlyphs">while restorer.pending():</text><text x="948.8" y="264.68" class="gutter" text-anchor="end">12</text><text x="954.8" y="264.68" class="sign-add">+</text><text x="968.6" y="264.68" class="code" xml:space="preserve" textLength="140.4" lengthAdjust="spacingAndGlyphs">    with restorer:</text><text x="25.6" y="283.68" class="gutter" text-anchor="end">6</text><text x="31.6" y="283.68" class="sign-del">-</text><text x="45.4" y="283.68" class="code" xml:space="preserve" textLength="179.4" lengthAdjust="spacingAndGlyphs">for epoch in range(50):</text><text x="948.8" y="283.68" class="gutter" text-anchor="end">13</text><text x="954.8" y="283.68" class="sign-add">+</text><text x="968.6" y="283.68" class="code" xml:space="preserve" textLength="304.2" lengthAdjust="spacingAndGlyphs">        for epoch in restorer.epochs():</text><text x="25.6" y="302.68" class="gutter" text-anchor="end">7</text><text x="31.6" y="302.68" class="sign-del">-</text><text x="45.4" y="302.68" class="code" xml:space="preserve" textLength="312.0" lengthAdjust="spacingAndGlyphs">    for inputs, targets in train_loader:</text><text x="948.8" y="302.68" class="gutter" text-anchor="end">14</text><text x="954.8" y="302.68" class="sign-add">+</text><text x="968.6" y="302.68" class="code" xml:space="preserve" textLength="725.4" lengthAdjust="spacingAndGlyphs">            for inputs, targets in session.batches(train_loader, phase=&quot;train&quot;, epoch=epoch):</text><text x="25.6" y="321.68" class="gutter" text-anchor="end">8</text><text x="45.4" y="321.68" class="code" xml:space="preserve" textLength="226.2" lengthAdjust="spacingAndGlyphs">        optimizer.zero_grad()</text><text x="948.8" y="321.68" class="gutter" text-anchor="end">15</text><text x="968.6" y="321.68" class="code" xml:space="preserve" textLength="288.6" lengthAdjust="spacingAndGlyphs">                optimizer.zero_grad()</text><text x="25.6" y="340.68" class="gutter" text-anchor="end">9</text><text x="45.4" y="340.68" class="code" xml:space="preserve" textLength="374.4" lengthAdjust="spacingAndGlyphs">        loss = criterion(model(inputs), targets)</text><text x="948.8" y="340.68" class="gutter" text-anchor="end">16</text><text x="968.6" y="340.68" class="code" xml:space="preserve" textLength="436.8" lengthAdjust="spacingAndGlyphs">                loss = criterion(model(inputs), targets)</text><text x="25.6" y="359.68" class="gutter" text-anchor="end">10</text><text x="45.4" y="359.68" class="code" xml:space="preserve" textLength="179.4" lengthAdjust="spacingAndGlyphs">        loss.backward()</text><text x="948.8" y="359.68" class="gutter" text-anchor="end">17</text><text x="968.6" y="359.68" class="code" xml:space="preserve" textLength="241.8" lengthAdjust="spacingAndGlyphs">                loss.backward()</text><text x="25.6" y="378.68" class="gutter" text-anchor="end">11</text><text x="45.4" y="378.68" class="code" xml:space="preserve" textLength="187.2" lengthAdjust="spacingAndGlyphs">        optimizer.step()</text><text x="948.8" y="378.68" class="gutter" text-anchor="end">18</text><text x="968.6" y="378.68" class="code" xml:space="preserve" textLength="249.6" lengthAdjust="spacingAndGlyphs">                optimizer.step()</text><text x="948.8" y="397.68" class="gutter" text-anchor="end">19</text><text x="948.8" y="416.68" class="gutter" text-anchor="end">20</text><text x="954.8" y="416.68" class="sign-add">+</text><text x="968.6" y="416.68" class="code" xml:space="preserve" textLength="117.0" lengthAdjust="spacingAndGlyphs">session.close()</text><text x="45.4" y="22.44" class="hdr">Raw PyTorch</text><text x="968.6" y="22.44" class="hdr">Raw PyTorch + nansense</text>

  <text x="17.8" y="55.68" class="gutter" text-anchor="end">1</text><text x="37.6" y="55.68" class="code" xml:space="preserve" textLength="163.8" lengthAdjust="spacingAndGlyphs">import lightning as L</text><text x="722.6" y="55.68" class="gutter" text-anchor="end">1</text><text x="742.4" y="55.68" class="code" xml:space="preserve" textLength="163.8" lengthAdjust="spacingAndGlyphs">import lightning as L</text><text x="722.6" y="74.68" class="gutter" text-anchor="end">2</text><text x="728.6" y="74.68" class="sign-add">+</text><text x="742.4" y="74.68" class="code" xml:space="preserve" textLength="538.2" lengthAdjust="spacingAndGlyphs">from nansense.lightning import NansenseCallback, fit_with_time_travel</text><text x="17.8" y="93.68" class="gutter" text-anchor="end">2</text><text x="722.6" y="93.68" class="gutter" text-anchor="end">3</text><text x="722.6" y="112.68" class="gutter" text-anchor="end">4</text><text x="742.4" y="112.68" class="code" xml:space="preserve" textLength="631.8" lengthAdjust="spacingAndGlyphs"># `model=&quot;net&quot;` is the attribute path to the network inside your LightningModule.</text><text x="722.6" y="131.68" class="gutter" text-anchor="end">5</text><text x="728.6" y="131.68" class="sign-add">+</text><text x="742.4" y="131.68" class="code" xml:space="preserve" textLength="397.8" lengthAdjust="spacingAndGlyphs">callback = NansenseCallback(port=8080, model=&quot;net&quot;)</text><text x="722.6" y="150.68" class="gutter" text-anchor="end">6</text><text x="722.6" y="169.68" class="gutter" text-anchor="end">7</text><text x="742.4" y="169.68" class="code" xml:space="preserve" textLength="608.4" lengthAdjust="spacingAndGlyphs"># Time-travel: trainer factory enables restarting training at different epochs</text><text x="17.8" y="188.68" class="gutter" text-anchor="end">3</text><text x="23.8" y="188.68" class="sign-del">-</text><text x="37.6" y="188.68" class="code" xml:space="preserve" textLength="265.2" lengthAdjust="spacingAndGlyphs">trainer = L.Trainer(max_epochs=50)</text><text x="722.6" y="188.68" class="gutter" text-anchor="end">8</text><text x="728.6" y="188.68" class="sign-add">+</text><text x="742.4" y="188.68" class="code" xml:space="preserve" textLength="366.6" lengthAdjust="spacingAndGlyphs">make_trainer = lambda: L.Trainer(max_epochs=50)</text><text x="17.8" y="207.68" class="gutter" text-anchor="end">4</text><text x="23.8" y="207.68" class="sign-del">-</text><text x="37.6" y="207.68" class="code" xml:space="preserve" textLength="327.6" lengthAdjust="spacingAndGlyphs">trainer.fit(module, datamodule=datamodule)</text><text x="722.6" y="207.68" class="gutter" text-anchor="end">9</text><text x="728.6" y="207.68" class="sign-add">+</text><text x="742.4" y="207.68" class="code" xml:space="preserve" textLength="655.2" lengthAdjust="spacingAndGlyphs">fit_with_time_travel(make_trainer, module, datamodule=datamodule, callback=callback)</text><text x="37.6" y="22.44" class="hdr">PyTorch Lightning</text><text x="742.4" y="22.44" class="hdr">PyTorch Lightning + nansense</text>

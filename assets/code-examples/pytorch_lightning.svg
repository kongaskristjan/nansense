  <text x="25.6" y="55.68" class="gutter" text-anchor="end">1</text><text x="45.4" y="55.68" class="code" xml:space="preserve" textLength="163.8" lengthAdjust="spacingAndGlyphs">import lightning as L</text><text x="894.2" y="55.68" class="gutter" text-anchor="end">1</text><text x="914.0" y="55.68" class="code" xml:space="preserve" textLength="163.8" lengthAdjust="spacingAndGlyphs">import lightning as L</text><text x="894.2" y="74.68" class="gutter" text-anchor="end">2</text><text x="900.2" y="74.68" class="sign-add">+</text><text x="914.0" y="74.68" class="code" xml:space="preserve" textLength="538.2" lengthAdjust="spacingAndGlyphs">from nansense.lightning import NansenseCallback, fit_with_time_travel</text><text x="25.6" y="93.68" class="gutter" text-anchor="end">2</text><text x="894.2" y="93.68" class="gutter" text-anchor="end">3</text><text x="894.2" y="112.68" class="gutter" text-anchor="end">4</text><text x="900.2" y="112.68" class="sign-add">+</text><text x="914.0" y="112.68" class="code" xml:space="preserve" textLength="592.8" lengthAdjust="spacingAndGlyphs"># `model=` is the attribute path to the network inside your LightningModule.</text><text x="894.2" y="131.68" class="gutter" text-anchor="end">5</text><text x="900.2" y="131.68" class="sign-add">+</text><text x="914.0" y="131.68" class="code" xml:space="preserve" textLength="335.4" lengthAdjust="spacingAndGlyphs"># A live UI opens at http://localhost:8080.</text><text x="894.2" y="150.68" class="gutter" text-anchor="end">6</text><text x="900.2" y="150.68" class="sign-add">+</text><text x="914.0" y="150.68" class="code" xml:space="preserve" textLength="397.8" lengthAdjust="spacingAndGlyphs">callback = NansenseCallback(port=8080, model=&quot;net&quot;)</text><text x="894.2" y="169.68" class="gutter" text-anchor="end">7</text><text x="900.2" y="169.68" class="sign-add">+</text><text x="894.2" y="188.68" class="gutter" text-anchor="end">8</text><text x="900.2" y="188.68" class="sign-add">+</text><text x="914.0" y="188.68" class="code" xml:space="preserve" textLength="592.8" lengthAdjust="spacingAndGlyphs"># Time travel: `fit_with_time_travel` wraps a stock Trainer so the UI&#x27;s Time</text><text x="894.2" y="207.68" class="gutter" text-anchor="end">9</text><text x="900.2" y="207.68" class="sign-add">+</text><text x="914.0" y="207.68" class="code" xml:space="preserve" textLength="577.2" lengthAdjust="spacingAndGlyphs"># Travel button rewinds the fit to any epoch (a factory, because each jump</text><text x="894.2" y="226.68" class="gutter" text-anchor="end">10</text><text x="900.2" y="226.68" class="sign-add">+</text><text x="914.0" y="226.68" class="code" xml:space="preserve" textLength="195.0" lengthAdjust="spacingAndGlyphs"># needs a fresh Trainer).</text><text x="25.6" y="245.68" class="gutter" text-anchor="end">3</text><text x="31.6" y="245.68" class="sign-del">-</text><text x="45.4" y="245.68" class="code" xml:space="preserve" textLength="374.4" lengthAdjust="spacingAndGlyphs">L.Trainer(max_epochs=50).fit(module, datamodule)</text><text x="894.2" y="245.68" class="gutter" text-anchor="end">11</text><text x="900.2" y="245.68" class="sign-add">+</text><text x="914.0" y="245.68" class="code" xml:space="preserve" textLength="811.2" lengthAdjust="spacingAndGlyphs">fit_with_time_travel(lambda: L.Trainer(max_epochs=50), module, callback=callback, datamodule=datamodule)</text><text x="45.4" y="22.44" class="hdr">PyTorch Lightning</text><text x="914.0" y="22.44" class="hdr">PyTorch Lightning + nansense</text>
</svg>

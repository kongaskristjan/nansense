[project]
name = "nansense"
version = "0.1.0"
description = "Visualization library for deep learning experiments."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kristjan Kongas", email = "kongaskristjan@gmail.com" }]
requires-python = ">=3.13"
keywords = ["pytorch", "visualization", "deep-learning", "training", "debugging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# torch is deliberately NOT a dependency: installing it is left to the user
# so their hardware-specific build (CUDA / ROCm / CPU) is preserved.
dependencies = [
    "fastapi>=0.110",
    "nicegui>=3.12.1",
    "numpy>=2",
    "pillow>=12.2.0",
    "plotly>=6.7.0",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/kongaskristjan/nansense"
Repository = "https://github.com/kongaskristjan/nansense"

[project.optional-dependencies]
captum = ["captum>=0.9.0"]
lightning = [
    "lightning>=2.4",
]

# The torch variants live in (unpublished) dependency groups rather than
# extras, so the PyPI package never installs torch — not even optionally.
[dependency-groups]
cpu = ["torch>=2.12.0", "torchvision>=0.27.0"]
cu126 = ["torch>=2.12.0", "torchvision>=0.27.0"]
cu130 = ["torch>=2.12.0", "torchvision>=0.27.0"]
cu132 = ["torch>=2.12.0", "torchvision>=0.27.0"]
rocm7-2 = [
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "triton-rocm ; sys_platform == 'linux'",
]
dev = [
    "captum>=0.9.0",
    "lightning>=2.4",
    "pytest>=9.0.3",
    "ty>=0.0.38",
]

[tool.uv]
conflicts = [
    [
        { group = "cpu" },
        { group = "cu126" },
        { group = "cu130" },
        { group = "cu132" },
        { group = "rocm7-2" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu130", group = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu132", group = "cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm7-2", group = "rocm7-2", marker = "sys_platform == 'linux'" },
]
triton-rocm = [
    { index = "pytorch-rocm7-2", group = "rocm7-2", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu126", group = "cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu130", group = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu132", group = "cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm7-2", group = "rocm7-2", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm7-2"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nansense"]

[tool.pytest.ini_options]
testpaths = ["tests"]

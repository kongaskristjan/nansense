name: CI

on:
  push:
    branches: [main]

# GitHub-hosted runners have no GPU, so jobs sync the `cpu` torch extra.

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group cpu
      - run: uv run --group cpu ty check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group cpu
      - run: uv run --group cpu pytest
